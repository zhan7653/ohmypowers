name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: node --test tests/*.test.js tests/power-work-report/*.test.js
      - name: Check bundled work-report JavaScript
        run: npm --prefix power-work-report/scripts/power-work-report run check
      - name: Check installer syntax and patch whitespace
        run: |
          bash -n scripts/install.sh
          git diff --check
